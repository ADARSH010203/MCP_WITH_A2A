services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-a2a}
      POSTGRES_USER: ${POSTGRES_USER:-a2a}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-a2a} -d ${POSTGRES_DB:-a2a}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  a2a:
    environment:
      A2A_TASK_STORE_BACKEND: postgres
      A2A_TASK_DATABASE_URL: postgresql://${POSTGRES_USER:-a2a}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-a2a}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
