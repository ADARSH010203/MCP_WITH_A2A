name: Deploy documentation site

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check GitHub Pages availability
        id: pages_status
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.repos.getPagesSite({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              core.setOutput("enabled", "true");
            } catch (error) {
              if (error.status === 404) {
                core.info(
                  "GitHub Pages is not enabled/configured for this repository. " +
                  "The site will be uploaded as a normal workflow artifact instead."
                );
                core.setOutput("enabled", "false");
              } else {
                throw error;
              }
            }

      - name: Configure GitHub Pages
        if: steps.pages_status.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.pages_status.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Upload static site fallback
        if: steps.pages_status.outputs.enabled != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: documentation-site
          path: docs

      - name: Deploy site
        if: steps.pages_status.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
