name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify dependencies
        run: python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q app host frontend scripts experiments tests

      - name: Lint
        run: ruff check app host frontend scripts experiments tests

      - name: Test
        run: pytest -q --tb=short

      - name: Evaluate routing benchmark
        run: python -m experiments.run_evaluation --min-routing-accuracy 1.0 --min-overall-accuracy 1.0
