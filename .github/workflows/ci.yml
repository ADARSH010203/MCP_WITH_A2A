name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: a2a
          POSTGRES_USER: a2a
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U a2a -d a2a"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify dependencies
        run: python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q app host frontend scripts experiments tests

      - name: Lint
        run: ruff check app host frontend scripts experiments tests

      - name: Unit and regression tests
        run: pytest -q tests --ignore=tests/integration --ignore=tests/safety --tb=short

      - name: Integration tests
        run: pytest -q tests/integration --tb=short

      - name: PostgreSQL integration tests
        env:
          TEST_POSTGRES_URL: postgresql://a2a:ci-password@127.0.0.1:5432/a2a
        run: pytest -q tests/integration/test_postgres_task_store.py --tb=short

      - name: Safety tests
        run: pytest -q tests/safety --tb=short

      - name: Validate LLM quality dataset
        run: python -m experiments.validate_quality_dataset

      - name: Evaluate routing benchmark
        run: python -m experiments.run_evaluation --min-routing-accuracy 1.0 --min-overall-accuracy 1.0

      - name: Cost regression gate
        run: python -m experiments.check_cost_regression
