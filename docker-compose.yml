services:
  mcp:
    build: .
    command: ["python", "-m", "scripts.run_mcp_server"]
    expose:
      - "3000"
    environment:
      MCP_SANDBOX_ROOT: /app/workspace
      MCP_ALLOWED_TOOLS: ${MCP_ALLOWED_TOOLS:-}
      MCP_MAX_FILE_BYTES: ${MCP_MAX_FILE_BYTES:-2000000}
      MCP_MAX_OUTPUT_CHARS: ${MCP_MAX_OUTPUT_CHARS:-20000}
      MCP_MAX_SEARCH_QUERY_CHARS: ${MCP_MAX_SEARCH_QUERY_CHARS:-200}
      MCP_MAX_SEARCH_RESULTS: ${MCP_MAX_SEARCH_RESULTS:-500}
      MCP_DEFAULT_PAGE_SIZE: ${MCP_DEFAULT_PAGE_SIZE:-25}
      MCP_MAX_PAGE_SIZE: ${MCP_MAX_PAGE_SIZE:-100}
      MCP_MAX_CSV_ROWS: ${MCP_MAX_CSV_ROWS:-10000}
      MCP_MAX_CSV_COLUMNS: ${MCP_MAX_CSV_COLUMNS:-100}
    volumes:
      - mcp_workspace:/app/workspace
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    profiles: ["distributed"]
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  a2a:
    build: .
    command:
      [
        "python",
        "-m",
        "scripts.run_a2a_server",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ]
    ports:
      - "8000:8000"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-meta-llama/llama-4-scout-17b-16e-instruct}
      A2A_SEMANTIC_ROUTING_ENABLED: ${A2A_SEMANTIC_ROUTING_ENABLED:-true}
      A2A_SEMANTIC_ROUTING_MIN_SCORE: ${A2A_SEMANTIC_ROUTING_MIN_SCORE:-0.58}
      A2A_SEMANTIC_ROUTING_SECONDARY_SCORE: ${A2A_SEMANTIC_ROUTING_SECONDARY_SCORE:-0.72}
      A2A_SEMANTIC_ROUTING_MAX_AGENTS: ${A2A_SEMANTIC_ROUTING_MAX_AGENTS:-3}
      A2A_ALLOWED_AGENTS: ${A2A_ALLOWED_AGENTS:-}
      MCP_URL: http://mcp:3000/sse
      MCP_SANDBOX_ROOT: /app/workspace
      MCP_ALLOWED_TOOLS: ${MCP_ALLOWED_TOOLS:-}
      MCP_MAX_FILE_BYTES: ${MCP_MAX_FILE_BYTES:-2000000}
      MCP_MAX_OUTPUT_CHARS: ${MCP_MAX_OUTPUT_CHARS:-20000}
      MCP_MAX_SEARCH_QUERY_CHARS: ${MCP_MAX_SEARCH_QUERY_CHARS:-200}
      MCP_MAX_SEARCH_RESULTS: ${MCP_MAX_SEARCH_RESULTS:-500}
      MCP_DEFAULT_PAGE_SIZE: ${MCP_DEFAULT_PAGE_SIZE:-25}
      MCP_MAX_PAGE_SIZE: ${MCP_MAX_PAGE_SIZE:-100}
      MCP_MAX_CSV_ROWS: ${MCP_MAX_CSV_ROWS:-10000}
      MCP_MAX_CSV_COLUMNS: ${MCP_MAX_CSV_COLUMNS:-100}
      A2A_PUBLIC_URL: ${A2A_PUBLIC_URL:-http://localhost:8000}
      A2A_API_KEY: ${A2A_API_KEY:-}
      A2A_PRINCIPAL_API_KEYS: ${A2A_PRINCIPAL_API_KEYS:-}
      A2A_CORS_ORIGINS: ${A2A_CORS_ORIGINS:-}
      A2A_SPECIALIST_URLS: ${A2A_SPECIALIST_URLS:-}
      A2A_SPECIALIST_API_KEYS: ${A2A_SPECIALIST_API_KEYS:-}
      A2A_REMOTE_REQUIRE_HTTPS: ${A2A_REMOTE_REQUIRE_HTTPS:-true}
      A2A_REMOTE_REQUIRE_AUTH: ${A2A_REMOTE_REQUIRE_AUTH:-true}
      A2A_TASK_DB_PATH: /app/.data/a2a_tasks.db
      A2A_TASK_RETENTION_DAYS: ${A2A_TASK_RETENTION_DAYS:-30}
      A2A_TASK_LEASE_SECONDS: ${A2A_TASK_LEASE_SECONDS:-300}
      A2A_TASK_RECOVERY_WORKER_ENABLED: ${A2A_TASK_RECOVERY_WORKER_ENABLED:-true}
      A2A_TASK_RECOVERY_POLL_SECONDS: ${A2A_TASK_RECOVERY_POLL_SECONDS:-2}
      A2A_TASK_RECOVERY_BATCH_SIZE: ${A2A_TASK_RECOVERY_BATCH_SIZE:-10}
      A2A_EVENT_BUS_BACKEND: ${A2A_EVENT_BUS_BACKEND:-memory}
      A2A_EVENT_BUS_URL: ${A2A_EVENT_BUS_URL:-redis://redis:6379/0}
      A2A_EVENT_BUS_CHANNEL_PREFIX: ${A2A_EVENT_BUS_CHANNEL_PREFIX:-a2a:task:}
      A2A_EVENT_BUS_MAX_MESSAGE_BYTES: ${A2A_EVENT_BUS_MAX_MESSAGE_BYTES:-1000000}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-mcp-a2a-agent}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      PROMETHEUS_METRICS_ENABLED: ${PROMETHEUS_METRICS_ENABLED:-true}
      A2A_WORKER_ID: ${A2A_WORKER_ID:-}
      A2A_MEMORY_DB_PATH: /app/.data/a2a_memory.db
      A2A_MEMORY_TURNS: ${A2A_MEMORY_TURNS:-8}
      A2A_MEMORY_MAX_CHARS: ${A2A_MEMORY_MAX_CHARS:-4000}
      A2A_MEMORY_RETENTION_DAYS: ${A2A_MEMORY_RETENTION_DAYS:-30}
      A2A_MEMORY_NAMESPACE_SECRET: ${A2A_MEMORY_NAMESPACE_SECRET:-}
      A2A_SPECIALIST_TIMEOUT_SECONDS: ${A2A_SPECIALIST_TIMEOUT_SECONDS:-45}
      A2A_SPECIALIST_MAX_RETRIES: ${A2A_SPECIALIST_MAX_RETRIES:-1}
      A2A_SPECIALIST_RETRY_BACKOFF_SECONDS: ${A2A_SPECIALIST_RETRY_BACKOFF_SECONDS:-0.25}
      A2A_SPECIALIST_RETRY_MAX_BACKOFF_SECONDS: ${A2A_SPECIALIST_RETRY_MAX_BACKOFF_SECONDS:-5.0}
      A2A_SPECIALIST_RETRY_JITTER_RATIO: ${A2A_SPECIALIST_RETRY_JITTER_RATIO:-0.25}
      A2A_SPECIALIST_TOTAL_TIMEOUT_SECONDS: ${A2A_SPECIALIST_TOTAL_TIMEOUT_SECONDS:-90.0}
      A2A_MAX_AGENT_CALLS_PER_TASK: ${A2A_MAX_AGENT_CALLS_PER_TASK:-6}
      A2A_COST_INPUT_USD_PER_1M_TOKENS: ${A2A_COST_INPUT_USD_PER_1M_TOKENS:-0}
      A2A_COST_OUTPUT_USD_PER_1M_TOKENS: ${A2A_COST_OUTPUT_USD_PER_1M_TOKENS:-0}
      A2A_MAX_TOTAL_TOKENS_PER_TASK: ${A2A_MAX_TOTAL_TOKENS_PER_TASK:-0}
      A2A_MAX_ESTIMATED_COST_USD_PER_TASK: ${A2A_MAX_ESTIMATED_COST_USD_PER_TASK:-0}
      A2A_COST_LEDGER_ENABLED: ${A2A_COST_LEDGER_ENABLED:-false}
      A2A_DAILY_TOKEN_LIMIT_PER_PRINCIPAL: ${A2A_DAILY_TOKEN_LIMIT_PER_PRINCIPAL:-0}
      A2A_MONTHLY_TOKEN_LIMIT_PER_PRINCIPAL: ${A2A_MONTHLY_TOKEN_LIMIT_PER_PRINCIPAL:-0}
      A2A_DAILY_COST_LIMIT_USD_PER_PRINCIPAL: ${A2A_DAILY_COST_LIMIT_USD_PER_PRINCIPAL:-0}
      A2A_MONTHLY_COST_LIMIT_USD_PER_PRINCIPAL: ${A2A_MONTHLY_COST_LIMIT_USD_PER_PRINCIPAL:-0}
    volumes:
      - a2a_data:/app/.data
    depends_on:
      - mcp
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3).read()"
        ]
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3

volumes:
  a2a_data:
  mcp_workspace:

  redis_data:

